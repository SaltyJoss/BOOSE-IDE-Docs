  assemblies:
  - BOOSECoreApp
  namespace: BOOSECoreApp.Core.Conditionals
  summary: Represents a command that modifies the program counter to exit a while-loop operation.
  remarks: >-
    This command is used to adjust the program counter (<xref href="BOOSECoreApp.Core.Base.StoredProgramApp.PC" data-throw-if-not-resolved="false"></xref>) to the index preceding the start of a while-loop, effectively ending the loop. 

    The <xref href="BOOSECoreApp.Core.Conditionals.EndWhileApp.WhileIndex" data-throw-if-not-resolved="false"></xref> property must be set to the appropriate index before executing this command.
