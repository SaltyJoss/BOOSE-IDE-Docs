  langs:
  - csharp
  - vb
  name: DeploymentItemAttribute
  nameWithType: DeploymentItemAttribute
  fullName: Microsoft.VisualStudio.TestTools.UnitTesting.DeploymentItemAttribute
  type: Class
  assemblies:
  - Microsoft.VisualStudio.TestPlatform.TestFramework.Extensions
  namespace: Microsoft.VisualStudio.TestTools.UnitTesting
  summary: >-
    Used to specify deployment item (file or directory) per-test deployment for copying files or folders specified as deployment items to the <xref href="Microsoft.VisualStudio.TestTools.UnitTesting.TestContext" data-throw-if-not-resolved="false"></xref>.DeploymentDirectory.

    Deployment directory is where all the deployment items are present along with TestSource dll.

    Can be specified on test class or test method.

    Can have multiple instances of the attribute to specify more than one item.

    The item path can be absolute or relative, if relative, it is relative to RunConfig.RelativePathRoot.
  remarks: >-
    If specified on a test class, the class needs to contain at least one test method. This means that the

    attribute cannot be combined with a test class that would contain only a AssemblyInitialize or ClassInitialize

    method.
  example:
  - >-
    [DeploymentItem("file1.xml")]

    [DeploymentItem("file2.xml", "DataFiles")]

    [DeploymentItem("bin\Debug")].
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class|AttributeTargets.Method, AllowMultiple = true)]

      public sealed class DeploymentItemAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.ClassOrAttributeTargets.Method, AllowMultiple:=True)>

      Public NotInheritable Class DeploymentItemAttribute Inherits Attribute
