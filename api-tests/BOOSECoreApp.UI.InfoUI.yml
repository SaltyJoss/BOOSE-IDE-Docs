  assemblies:
  - BOOSECoreApp
  namespace: BOOSECoreApp.UI
  summary: Displays informational text with a specified header and formatting options.
  remarks: This method appends the specified header and informational text to the configured <xref href="System.Windows.Forms.RichTextBox" data-throw-if-not-resolved="false"></xref>, applying the specified color and formatting options.
  example: []
  syntax:
    content: public void DisplayInfo(string header, string info, Color headerCol, InfoAlign align = InfoAlign.Center, InfoPos pos = InfoPos.Middle)
    parameters:
    - id: header
      type: System.String
      description: The header text to be displayed.
    - id: info
      type: System.String
      description: The informational text to be displayed.
    - id: headerCol
      type: System.Drawing.Color
      description: The color to be used for the header text.
    - id: align
      type: BOOSECoreApp.UI.InfoAlign
      description: The horizontal alignment for the text. Default is <xref href="BOOSECoreApp.UI.InfoAlign.Center" data-throw-if-not-resolved="false"></xref>.
    - id: pos
      type: BOOSECoreApp.UI.InfoPos
      description: The vertical position for the text. Default is <xref href="BOOSECoreApp.UI.InfoPos.Middle" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public Sub DisplayInfo(header As String, info As String, headerCol As Color, align As InfoAlign = InfoAlign.Center, pos As InfoPos = InfoPos.Middle)
