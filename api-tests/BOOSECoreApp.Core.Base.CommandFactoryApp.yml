    href: https://github.com/ASE2025repos/ase-boose-assignment-SaltyJoss/blob/55d2b27d58f7b59c269a65ea8a7973052a6dd3ea/BOOSECoreApp/Core/Base/CommandFactoryApp.cs
  assemblies:
  - BOOSECoreApp
  namespace: BOOSECoreApp.Core.Base
  summary: >-
    Factory responsible for creating BOOSE command and variable objects from string identifiers.

    Provides a mapping from command names (e.g., "moveto", "drawto") to their corresponding <xref href="BOOSECoreApp.Core.Interfaces.ICommandApp" data-throw-if-not-resolved="false"></xref> implementations.
  remarks: >-
    Adheres to the Open/Closed principle by decoupling command registration from execution.

    Follows the singleton pattern to provide a single global access point for command creation.

    Allows easy addition of new commands and variable types by updating the internal registry.

    Enables extension to the boose.dll base WITHOUT modification.
  example: []
  syntax:
    content: 'public sealed class CommandFactoryApp : CommandFactory, ICommandFactory'
    content.vb: Public NotInheritable Class CommandFactoryApp Inherits CommandFactory Implements ICommandFactory
