  assemblies:
  - BOOSECoreApp
  namespace: BOOSECoreApp.Core.Base
  summary: Creates a new <xref href="BOOSECoreApp.Core.Interfaces.ICommandApp" data-throw-if-not-resolved="false"></xref> instance based on the provided command type string.
  example: []
  syntax:
    content: public ICommandApp? MakeCommand(string commandType, string? name = null, string? initialValue = null)
    parameters:
    - id: commandType
      type: System.String
      description: Command or variable type name (case-insensitive).
    - id: name
      type: System.String
      description: Optional name assigned to the created object, used for variable types.
    - id: initialValue
      type: System.String
      description: Optional initial value for variable instances.
    return:
      type: BOOSECoreApp.Core.Interfaces.ICommandApp
      description: A new <xref href="BOOSECoreApp.Core.Interfaces.ICommandApp" data-throw-if-not-resolved="false"></xref> instance corresponding to <code class="paramref">commandType</code>.
    content.vb: Public Function MakeCommand(commandType As String, name As String = Nothing, initialValue As String = Nothing) As ICommandApp
