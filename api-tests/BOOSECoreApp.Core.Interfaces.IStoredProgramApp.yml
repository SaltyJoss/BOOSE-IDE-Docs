  assemblies:
  - BOOSECoreApp
  namespace: BOOSECoreApp.Core.Interfaces
  summary: Retrieves a variable by its name.
  remarks: >-
    This method searches for the variable in the internal collection. 

    If the variable is not found, a warning is logged, and an <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref> is thrown.
  example: []
  syntax:
    content: SoftVariable GetVariable(string varName)
    parameters:
    - id: varName
      type: System.String
      description: The name of the variable to retrieve. This value is case-sensitive and cannot be null or empty.
    return:
      type: BOOSECoreApp.Core.Adapters.SoftVariable
      description: The <xref href="BOOSECoreApp.Core.Adapters.SoftVariable" data-throw-if-not-resolved="false"></xref> associated with the specified name.
    content.vb: Function GetVariable(varName As String) As SoftVariable
  overload: BOOSECoreApp.Core.Interfaces.IStoredProgramApp.GetVariable*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: Thrown if a variable with the specified name does not exist.
  nameWithType.vb: IStoredProgramApp.GetVariable(String)
  fullName.vb: BOOSECoreApp.Core.Interfaces.IStoredProgramApp.GetVariable(String)
  name.vb: GetVariable(String)
