  nameWithType: UILogger.LogFATAL(string)
  fullName: BOOSECoreApp.UI.UILogger.LogFATAL(string)
  type: Method
  source:
    href: https://github.com/ASE2025repos/ase-boose-assignment-SaltyJoss/blob/55d2b27d58f7b59c269a65ea8a7973052a6dd3ea/BOOSECoreApp/UI/UILogger.cs
  assemblies:
  - BOOSECoreApp
  namespace: BOOSECoreApp.UI
  summary: Logs a fatal error message to the debug output box in crimson, indicating critical failure.
  remarks: >-
    This handler is used differently to error and warning logs as it indicates a critical failure that may require immediate attention.

    It may not be seen during normal operation as it indicates a severe issue.

    Therefore this handler is a distinct log level, that is here for the sake of completeness.

    Check debug logs for fatal errors during troubleshooting.
  example: []
  syntax:
    content: public void LogFATAL(string msg)
    parameters:
    - id: msg
      type: System.String
      description: The message to log.
    content.vb: Public Sub LogFATAL(msg As String)
