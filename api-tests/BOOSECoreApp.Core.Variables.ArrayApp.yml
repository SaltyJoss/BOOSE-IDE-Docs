  assemblies:
  - BOOSECoreApp
  namespace: BOOSECoreApp.Core.Variables
  summary: >-
    Initializes a new instance of the <xref href="BOOSECoreApp.Core.Variables.ArrayApp" data-throw-if-not-resolved="false"></xref> class with the specified name, element type, and

    dimensions.
  remarks: >-
    This constructor initializes a two-dimensional array based on the specified <code class="paramref">elementType</code>. If <code class="paramref">elementType</code> is <xref href="BOOSECoreApp.Core.Variables.ArrayElementType.Int" data-throw-if-not-resolved="false"></xref>, an integer array is created. 

    If <code class="paramref">elementType</code> is <xref href="BOOSECoreApp.Core.Variables.ArrayElementType.Real" data-throw-if-not-resolved="false"></xref>, a double-precision floating-point array is created. Unsupported element types will result in an

    exception.
  example: []
  syntax:
    content: public ArrayApp(string name, ArrayElementType elementType, int cols, int rows)
    parameters:
    - id: name
      type: System.String
      description: The name of the array
    - id: elementType
      type: BOOSECoreApp.Core.Variables.ArrayElementType
      description: The type of elements stored in the array
    - id: cols
      type: System.Int32
      description: The number of columns in the array
    - id: rows
      type: System.Int32
      description: The number of rows in the array
    content.vb: Public Sub New(name As String, elementType As ArrayElementType, cols As Integer, rows As Integer)
  overload: BOOSECoreApp.Core.Variables.ArrayApp.#ctor*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: Thrown if <code class="paramref">elementType</code> is not supported or if <code class="paramref">cols</code> or <code class="paramref">rows</code> are less than or equal to zero.
