  summary: Parses the provided code and builds the program representation using the specified graphic adapter.
  remarks: >-
    Handles variable declerations, assignments, and operator expressions.

    Parsing errors and evaluation issues are caught and logged using <xref href="BOOSECoreApp.Exceptions.GlobalExceptionHandler" data-throw-if-not-resolved="false"></xref> methods, AND <xref href="BOOSECoreApp.Exceptions.BooseSyntaxException" data-throw-if-not-resolved="false"></xref>" exceptions -&gt; the later allows syntax error highlighting!/&gt;
