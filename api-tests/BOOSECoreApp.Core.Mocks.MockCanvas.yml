  assemblies:
  - BOOSETests
  namespace: BOOSECoreApp.Core.Mocks
  summary: >-
    A minimal mock implementation of <xref href="BOOSECoreApp.Core.Interfaces.IGraphicAdapter" data-throw-if-not-resolved="false"></xref> for testing BOOSE commands without performing any real drawing.

    All methods are no-ops.
  remarks: >-
    Used primarily for unit testing <xref href="BOOSE.StoredProgram" data-throw-if-not-resolved="false"></xref> and BOOSE variables <xref href="BOOSE.Array" data-throw-if-not-resolved="false"></xref>,  <xref href="BOOSE.Boolean" data-throw-if-not-resolved="false"></xref>, <xref href="BOOSE.Int" data-throw-if-not-resolved="false"></xref> and <xref href="BOOSE.Real" data-throw-if-not-resolved="false"></xref>.

    Does not track state or record calls.
