  summary: >-
    Parses and runs a BOOSE program on the specified <xref href="BOOSECoreApp.Core.Interfaces.IGraphicAdapter" data-throw-if-not-resolved="false"></xref>.

    Supports multi-line code and ignores empty lines or lines starting with '*'.
  remarks: Creates a <xref href="BOOSECoreApp.Core.Base.CommandFactoryApp" data-throw-if-not-resolved="false"></xref> and <xref href="BOOSECoreApp.Core.Base.StoredProgramApp" data-throw-if-not-resolved="false"></xref>, parses commands with <xref href="BOOSECoreApp.Core.Base.ParserApp" data-throw-if-not-resolved="false"></xref>, then executes them. Exceptions are logged without terminating the host application.
