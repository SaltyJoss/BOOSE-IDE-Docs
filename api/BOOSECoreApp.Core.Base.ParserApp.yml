  assemblies:
  - BOOSECoreApp
  namespace: BOOSECoreApp.Core.Base
  summary: Parses the BOOSE code string and populates the <xref href="BOOSECoreApp.Core.Interfaces.IStoredProgramApp" data-throw-if-not-resolved="false"></xref> with the corresponding commands.
  remarks: >-
    Handles variable declerations, assignments, and operator expressions.

    Parsing errors and evaluation issues are caught and logged using <xref href="System.Diagnostics.Debug" data-throw-if-not-resolved="false"></xref>, preventing application termination.
