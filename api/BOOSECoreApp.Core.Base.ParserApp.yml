  assemblies:
  - BOOSECoreApp
  namespace: BOOSECoreApp.Core.Base
  summary: Parses and Interprets BOOSE "source code", converting the text-based instructions from the IDE to executable commands.
  remarks: >-
    <p>

    <xref href="BOOSECoreApp.Core.Base.ParserApp" data-throw-if-not-resolved="false"></xref> class tokenises and validates BOOSE commands ("Source Code") before execution.

    It fully supports multi-line programs, command assignments, variable assingments.

    It also handles both parsing AND exception handling.

    </p>

    <p>

    Lines beginning with <code>*</code> are treated as a comment, and therefore are ignored.

    Empty Lines are skipped entirely.

    </p>
  example: []
