  namespace: BOOSECoreApp.Core.Variables
  summary: >-
    Represents a command-line application that modifies the value of an element in an array based on the provided

    parameters.
  remarks: >-
    This class extends <xref href="BOOSECoreApp.Core.Base.CommandApp" data-throw-if-not-resolved="false"></xref> and provides functionality to parse and execute

    commands for updating array elements. 

    The application expects parameters in the format: <code>poke &lt;array&gt; &lt;index&gt; = &lt;value&gt;</code>.
