  assemblies:
  - BOOSECoreApp
  namespace: BOOSECoreApp.Core.Adapters
  summary: >-
    Provides an adapter that exposes a <xref href="BOOSECoreApp.Core.Adapters.CanvasGraphicsAdapter.CanvasApp" data-throw-if-not-resolved="false"></xref> as an <xref href="BOOSECoreApp.Core.Interfaces.IGraphicAdapter" data-throw-if-not-resolved="false"></xref>

    and <xref href="BOOSECoreApp.Core.Interfaces.ICanvasProvider" data-throw-if-not-resolved="false"></xref> for executing drawing commands.
  remarks: >-
    This class allows commands to interact with a <xref href="BOOSECoreApp.Core.Adapters.CanvasGraphicsAdapter.CanvasApp" data-throw-if-not-resolved="false"></xref> via the standard

    graphics interface used in BOOSE applications.
