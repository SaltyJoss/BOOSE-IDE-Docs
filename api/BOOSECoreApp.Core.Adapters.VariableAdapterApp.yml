  source:
    href: https://github.com/ASE2025repos/ase-boose-assignment-SaltyJoss/blob/55d2b27d58f7b59c269a65ea8a7973052a6dd3ea/BOOSECoreApp/Core/Adapters/VariableAdapterApp.cs
  assemblies:
  - BOOSECoreApp
  namespace: BOOSECoreApp.Core.Adapters
  summary: Converts the specified object to a boolean value, using common conversion rules.
  example: []
  syntax:
    content: public static bool ToBool(object? value)
    parameters:
    - id: value
      type: System.Object
      description: >-
        The object to convert. 

        Can be of type <xref href="System.Boolean" data-throw-if-not-resolved="false"></xref>, <xref href="System.Int32" data-throw-if-not-resolved="false"></xref>, <xref href="System.Double" data-throw-if-not-resolved="false"></xref>,  or a string representation of these types.

        Null or unsupported types are treated as <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>
    return:
      type: System.Boolean
      description: >-
        <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> if the object represents a truthy value; otherwise, <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>. 

        For numeric types, non-zero values are considered truthy. For strings, values such as "true", "1", or  non-zero numeric strings are considered truthy
    content.vb: Public Shared Function ToBool(value As Object) As Boolean
  overload: BOOSECoreApp.Core.Adapters.VariableAdapterApp.ToBool*
  nameWithType.vb: VariableAdapterApp.ToBool(Object)
  fullName.vb: BOOSECoreApp.Core.Adapters.VariableAdapterApp.ToBool(Object)
  name.vb: ToBool(Object)
