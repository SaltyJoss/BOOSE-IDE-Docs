  summary: >-
    Represents a conditional command in a program, supporting <code>if</code>, <code>else if</code>, <code>else</code>, and <code>end

    if</code> constructs.
  remarks: >-
    This class is used to define and manage conditional logic within a stored program. It

    associates a conditional expression with the command and tracks the indices of related commands, such as <code>else

    if</code>, <code>else</code>, and <code>end if</code>.
